<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="binGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="recycleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle / Shield for crisp display across light and dark browser tabs -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Outer Rotating Reuse Arc 1 (Top Right) -->
  <path d="M 360 84 A 180 180 0 0 1 450 256" fill="none" stroke="#10B981" stroke-width="18" stroke-linecap="round"/>
  <polygon points="432,256 468,256 450,286" fill="#10B981"/>

  <!-- Outer Rotating Reuse Arc 2 (Bottom Left) -->
  <path d="M 152 428 A 180 180 0 0 1 62 256" fill="none" stroke="#10B981" stroke-width="18" stroke-linecap="round"/>
  <polygon points="80,256 44,256 62,226" fill="#10B981"/>

  <!-- Dustbin Lid Handle -->
  <rect x="220" y="112" width="72" height="18" rx="9" fill="url(#lidGrad)"/>

  <!-- Dustbin Main Lid with Smart Sensor Center -->
  <rect x="140" y="134" width="232" height="36" rx="12" fill="url(#lidGrad)"/>
  <circle cx="256" cy="152" r="7" fill="#34D399"/>

  <!-- Dustbin Body (Tapered Container) -->
  <path d="M 160 180 L 180 404 C 182 418 194 428 208 428 L 304 428 C 318 428 330 418 332 404 L 352 180 Z" fill="url(#binGrad)"/>

  <!-- Universal 3-Arrow Recycling / Reuse Symbol Centered on Bin -->
  <g transform="translate(256, 304) scale(0.95)" fill="url(#recycleGrad)">
    <!-- Top Arrow -->
    <path d="M -8 -72 L 8 -72 L 28 -72 L 0 -108 L -28 -72 L -12 -72 C -12 -52 -4 -38 12 -28 L 24 -42 C 14 -48 10 -58 10 -72 Z"/>
    
    <!-- Bottom Right Arrow -->
    <g transform="rotate(120)">
      <path d="M -8 -72 L 8 -72 L 28 -72 L 0 -108 L -28 -72 L -12 -72 C -12 -52 -4 -38 12 -28 L 24 -42 C 14 -48 10 -58 10 -72 Z"/>
    </g>

    <!-- Bottom Left Arrow -->
    <g transform="rotate(240)">
      <path d="M -8 -72 L 8 -72 L 28 -72 L 0 -108 L -28 -72 L -12 -72 C -12 -52 -4 -38 12 -28 L 24 -42 C 14 -48 10 -58 10 -72 Z"/>
    </g>
  </g>

  <!-- Vertical Bin Slits / Smart Accents -->
  <rect x="200" y="210" width="8" height="32" rx="4" fill="rgba(255,255,255,0.4)"/>
  <rect x="304" y="210" width="8" height="32" rx="4" fill="rgba(255,255,255,0.4)"/>
</svg>