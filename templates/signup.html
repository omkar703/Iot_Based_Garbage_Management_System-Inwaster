<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — InWaster</title>
    <link
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ url_for('static', filename='favicon.svg') }}"
    />
    <link
      rel="alternate icon"
      type="image/png"
      href="{{ url_for('static', filename='favicon.png') }}"
    />
    <style>
      :root {
        --canvas: #fbfbfe;
        --surface: #ffffff;
        --text-primary: #111827;
        --text-secondary: #4b5563;
        --border-color: #e5e7eb;
        --accent: #10b981;
        --accent-hover: #059669;
        --radius-md: 16px;
        --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.05);
      }
      body {
        background-color: var(--canvas);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .auth-container {
        width: 100%;
        max-width: 420px;
      }
      .brand-badge {
        font-weight: 700;
        font-size: 1.4rem;
        letter-spacing: -0.5px;
        color: var(--text-primary);
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        margin-bottom: 24px;
      }
      .brand-dot {
        width: 8px;
        height: 8px;
        background: var(--accent);
        border-radius: 50%;
        margin-left: 4px;
        display: inline-block;
      }
      .auth-card {
        background: var(--surface);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-card);
        padding: 36px;
      }
      .form-control {
        border-radius: 8px;
        border: 1px solid var(--border-color);
        padding: 12px 14px;
        font-size: 0.95rem;
      }
      .form-control:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
      }
      .btn-apple {
        background-color: var(--accent);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-weight: 600;
        width: 100%;
        font-size: 0.95rem;
        transition: all 0.2s ease;
      }
      .btn-apple:hover {
        background-color: var(--accent-hover);
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="text-center">
        <a href="{{ url_for('landing') }}" class="brand-badge d-inline-flex align-items-center">
          <img
            src="{{ url_for('static', filename='favicon.svg') }}"
            alt="InWaster Logo"
            width="32"
            height="32"
            class="mr-2"
            style="border-radius: 8px;"
          />
          InWaster
        </a>
      </div>

      <div class="auth-card">
        <h2 class="h4 font-weight-bold mb-1">Create Account</h2>
        <p class="text-muted small mb-4">Start earning points with your campus smart dustbin.</p>

        {% if message %}
          <div class="alert alert-danger py-2 px-3 small border-0 mb-3" role="alert">
            {{ message }}
          </div>
        {% endif %}

        <form method="POST">
          <div class="form-group mb-3">
            <label class="small font-weight-bold text-muted">Full Name</label>
            <input
              type="text"
              name="name"
              class="form-control"
              placeholder="Your name"
              required
            />
          </div>
          <div class="form-group mb-3">
            <label class="small font-weight-bold text-muted">Email Address</label>
            <input
              type="email"
              name="mail"
              class="form-control"
              placeholder="name@campus.edu"
              required
            />
          </div>
          <div class="form-group mb-4">
            <label class="small font-weight-bold text-muted">Password</label>
            <input
              type="password"
              name="passwd"
              class="form-control"
              placeholder="Create a strong password"
              required
            />
          </div>
          <button type="submit" class="btn-apple">Sign Up</button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <span class="text-muted small">Already have an account?</span>
          <a href="{{ url_for('login') }}" class="small font-weight-bold text-success ml-1">Sign In</a>
        </div>
      </div>
    </div>
  </body>
</html>
